name: Build Zygisk GLTools APK & Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK and Zygisk Module
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK & CMake
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Setup Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

    - name: Build Android App & Native C++ Libraries
      run: ./gradlew assembleDebug assembleRelease

    - name: Package Magisk / KernelSU Zygisk Module
      run: |
        mkdir -p release_package/zygisk
        
        # Locate and copy compiled Zygisk native libraries for arm64-v8a and armeabi-v7a
        find app/build/intermediates/cmake -name "libzygisk_gltools.so" | while read -r lib; do
          if echo "$lib" | grep -q "arm64-v8a"; then
            cp "$lib" release_package/zygisk/arm64-v8a.so
          elif echo "$lib" | grep -q "armeabi-v7a"; then
            cp "$lib" release_package/zygisk/armeabi-v7a.so
          fi
        done
        
        # Copy Magisk scripts and metadata
        cp module/magisk/module.prop release_package/
        cp module/magisk/customize.sh release_package/
        cp module/magisk/service.sh release_package/
        
        # Bundle the installable companion APK inside the flashable module
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          cp app/build/outputs/apk/debug/app-debug.apk release_package/GLToolsCompanion.apk
        fi
        
        # Create flashable ZIP
        cd release_package
        zip -r ../Zygisk_GLTools_v1.0.0.zip .
        cd ..

    - name: Upload Companion APK
      uses: actions/upload-artifact@v4
      with:
        name: GLToolsCompanion-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Flashable Magisk Module
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-GLTools-Magisk-Module
        path: Zygisk_GLTools_v1.0.0.zip
