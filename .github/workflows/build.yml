name: Build Zygisk GLTools APK & Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK and Zygisk Module
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK & CMake
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Setup Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

    - name: Build Android App & Native C++ Libraries
      run: ./gradlew assembleDebug assembleRelease

    - name: Package Magisk / KernelSU Zygisk Module
      run: |
        mkdir -p release_package/zygisk
        
        # Extract native Zygisk libraries directly from the built APK for every architecture
        APK_PATH=$(find app/build/outputs/apk -name "*debug.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        fi
        
        echo "Extracting native libraries from $APK_PATH..."
        
        python3 -c "
        import zipfile, os
        apk_path = '$APK_PATH'
        with zipfile.ZipFile(apk_path, 'r') as z:
            for item in z.namelist():
                if item.startswith('lib/') and item.endswith('libzygisk_gltools.so'):
                    abi = item.split('/')[1]
                    out_path = f'release_package/zygisk/{abi}.so'
                    with open(out_path, 'wb') as f:
                        f.write(z.read(item))
                    print(f'Successfully extracted {out_path} ({os.path.getsize(out_path)} bytes)')
        "
        
        echo "Contents of release_package/zygisk/:"
        ls -la release_package/zygisk/
        
        # Verify at least one library exists
        if [ -z "$(ls -A release_package/zygisk)" ]; then
          echo "ERROR: No native libraries were extracted into release_package/zygisk!"
          exit 1
        fi
        
        # Copy Magisk scripts and metadata
        cp module/magisk/module.prop release_package/
        cp module/magisk/customize.sh release_package/
        cp module/magisk/service.sh release_package/
        
        # Bundle companion APK inside flashable module
        cp "$APK_PATH" release_package/GLToolsCompanion.apk
        
        # Create flashable ZIP
        cd release_package
        zip -r ../Zygisk_GLTools_v1.0.0.zip .
        cd ..

    - name: Upload Companion APK
      uses: actions/upload-artifact@v4
      with:
        name: GLToolsCompanion-APK
        path: app/build/outputs/apk/*/*.apk

    - name: Upload Flashable Magisk Module
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-GLTools-Magisk-Module
        path: Zygisk_GLTools_v1.0.0.zip
